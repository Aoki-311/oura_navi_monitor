<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>OurA Navi User Analytics</title>
    <link rel="icon" type="image/svg+xml" href="/dashboard-assets/favicon.svg" />
    <link rel="stylesheet" href="/dashboard-assets/styles.css" />
    <script src="/dashboard-assets/vendor/chart.umd.min.js" defer></script>
    <script type="module" src="/dashboard-assets/app.js"></script>
  </head>
  <body>
    <header class="appHeader">
      <a class="brand" href="/dashboard" aria-label="OurA Navi User Analytics ホーム">
        <span class="brandMark">A</span>
        <span><small>OurA Navi</small><strong>User Analytics</strong></span>
      </a>
      <nav class="mainNav" aria-label="メインナビゲーション">
        <button data-page="overview">全体サマリー</button>
        <button data-page="user">ユーザー分析</button>
        <button data-page="management">ユーザー管理</button>
      </nav>
      <div class="headerTools">
        <label id="presetControl">期間<select id="analysisPreset"><option value="today">今日</option><option value="last_7d" selected>過去7日</option><option value="last_14d">過去14日</option><option value="last_30d">過去30日</option><option value="last_60d">過去60日</option><option value="all">全期間</option></select></label>
        <button id="exportButton" class="ghostButton">CSV</button>
        <button id="refreshButton" class="primaryButton">再読込</button>
      </div>
    </header>
    <main id="pageRoot" class="pageRoot" aria-live="polite"></main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
