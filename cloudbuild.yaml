steps:
  - id: precheck-files
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        test -f deploy/cloudrun.env.yaml
        test -f app/main.py
        test -f requirements.txt
        python scripts/render_runtime_env.py \
          --source deploy/cloudrun.env.yaml \
          --output /workspace/cloudrun.runtime.env.yaml \
          --iap-audience "${_IAP_AUDIENCE}"

  - id: precheck-python-compile
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        pip install --no-cache-dir -r requirements-dev.txt
        python -m compileall app
        python -m pytest -q

  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:$COMMIT_SHA
      - .

  - id: docker-push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:$COMMIT_SHA

  - id: cloud-run-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:$COMMIT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --service-account
      - ${_RUNTIME_SERVICE_ACCOUNT}
      - --no-allow-unauthenticated
      - --no-traffic
      - --tag
      - candidate
      - --env-vars-file
      - /workspace/cloudrun.runtime.env.yaml
      - --set-secrets
      - MONITOR_IDENTITY_HMAC_KEY=${_IDENTITY_SECRET}:latest
      - --labels
      - managed-by=cloud-build,repo=oura_navi_monitor

substitutions:
  _SERVICE_NAME: oura-navi-monitor
  _REGION: us-central1
  _RUNTIME_SERVICE_ACCOUNT: lcs-agent@lcs-developer-483404.iam.gserviceaccount.com
  _IDENTITY_SECRET: oura-navi-monitor-identity-hmac
  _IAP_AUDIENCE: REQUIRED

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:$COMMIT_SHA
