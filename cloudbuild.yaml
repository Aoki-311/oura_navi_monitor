steps:
  - id: precheck-files
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
          echo 'A full Git COMMIT_SHA is required for candidate provenance' >&2
          exit 2
        }
        [[ "${_RUNTIME_SERVICE_ACCOUNT}" =~ ^[a-z0-9-]+@${PROJECT_ID}\.iam\.gserviceaccount\.com$ ]] || {
          echo 'A configured Monitor runtime service account is required' >&2
          exit 2
        }
        test -f deploy/cloudrun.env.yaml
        test -f app/main.py
        test -f requirements.txt
        test -f .dockerignore
        test -f .gcloudignore
        if find . -type f \( -path '*/credentials/*' -o -name '*service-account*.json' \) -print -quit | grep -q .; then
          echo 'credential-shaped file is present in the Cloud Build source' >&2
          exit 2
        fi

  - id: precheck-python-compile
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        pip install --no-cache-dir -r requirements-dev.txt
        python -m compileall app scripts
        python -m pytest -q
        bash -n scripts/*.sh

  - id: precheck-frontend-syntax
    name: node:22-slim
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        find frontend -name '*.js' -print0 | xargs -0 -n1 node --check

  - id: docker-build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:$COMMIT_SHA
      - .

  - id: candidate-browser-contract
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:$COMMIT_SHA"
        network="monitor-e2e-${BUILD_ID}"
        container="monitor-e2e-${BUILD_ID}"
        cleanup() {
          docker rm -f "$${container}" >/dev/null 2>&1 || true
          docker network rm "$${network}" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        docker network create "$${network}" >/dev/null
        docker run -d --name "$${container}" --network "$${network}" \
          -e MONITOR_ALLOW_UNVERIFIED_LOCAL=true \
          -e MONITOR_ADMIN_ALLOWLIST=2401145@tc.terumo.co.jp \
          -e MONITOR_ANALYTICS_START_AT=2026-03-16T00:00:00Z \
          "$${image}" >/dev/null
        docker run --rm --network "$${network}" \
          mcr.microsoft.com/playwright:v1.58.2-noble \
          bash -lc "for attempt in \$(seq 1 60); do curl -fsS http://$${container}:8080/api/health >/dev/null && exit 0; sleep 1; done; exit 1"
        docker run --rm --network "$${network}" \
          -e MONITOR_E2E_BASE_URL="http://$${container}:8080" \
          -v /workspace/e2e:/work -w /work \
          mcr.microsoft.com/playwright:v1.58.2-noble \
          bash -lc 'npm ci --no-audit --no-fund && npm test'

  - id: docker-push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        tagged_image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:$COMMIT_SHA"
        push_log="/workspace/monitor-docker-push.log"
        docker push "$${tagged_image}" 2>&1 | tee "$${push_log}"
        digest="$$(./scripts/extract_docker_push_digest.sh "$COMMIT_SHA" "$${push_log}")"
        immutable_image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}@$${digest}"
        printf '%s\n' "$${immutable_image}" > /workspace/monitor-image-digest.txt

  - id: cloud-run-deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        [[ "${SHORT_SHA}" =~ ^[0-9a-f]{7}$ ]] || {
          echo 'A Git-backed SHORT_SHA is required for candidate provenance' >&2
          exit 2
        }
        immutable_image="$$(cat /workspace/monitor-image-digest.txt)"
        [[ "$${immutable_image}" =~ ^${_REGION}-docker\.pkg\.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}@sha256:[0-9a-f]{64}$ ]] || {
          echo 'docker push receipt did not produce the expected immutable image URI' >&2
          exit 2
        }
        build_id="${BUILD_ID}"
        build_token="$${build_id%%-*}"
        [[ "$${build_token}" =~ ^[0-9a-f]{8}$ ]] || {
          echo 'Cloud Build ID did not produce a safe revision token' >&2
          exit 2
        }
        revision_suffix="${SHORT_SHA}-$${build_token}"
        candidate_revision="${_SERVICE_NAME}-$${revision_suffix}"
        current_runtime_service_account="$$(
          gcloud run services describe "${_SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${_REGION}" \
            --format='value(spec.template.spec.serviceAccountName)'
        )"
        [[ "$${current_runtime_service_account}" == "${_RUNTIME_SERVICE_ACCOUNT}" ]] || {
          echo 'current Monitor runtime service account does not match the frozen release contract' >&2
          exit 2
        }
        printf '%s\n' "$${current_runtime_service_account}" \
          > /workspace/monitor-predeploy-runtime-service-account.txt
        gcloud run services describe "${_SERVICE_NAME}" \
          --project "${PROJECT_ID}" --region "${_REGION}" --format=json \
          > /workspace/monitor-predeploy-service.json
        gcloud run services get-iam-policy "${_SERVICE_NAME}" \
          --project "${PROJECT_ID}" --region "${_REGION}" --format=json \
          > /workspace/monitor-predeploy-iam.json
        gcloud run deploy "${_SERVICE_NAME}" \
          --project "${PROJECT_ID}" \
          --image "$${immutable_image}" \
          --region "${_REGION}" \
          --platform managed \
          --service-account "${_RUNTIME_SERVICE_ACCOUNT}" \
          --no-traffic \
          --tag candidate \
          --revision-suffix "$${revision_suffix}" \
          --env-vars-file deploy/cloudrun.env.yaml \
          --remove-secrets=MONITOR_IDENTITY_HMAC_KEY \
          --labels "managed-by=cloud-build,repo=oura-navi-monitor,git-sha=${COMMIT_SHA}"
        printf '%s\n' "$${candidate_revision}" > /workspace/monitor-candidate-revision.txt
        printf 'candidate_image=%s\n' "$${immutable_image}"

  - id: verify-candidate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -lc
      - |
        set -euo pipefail
        immutable_image="$$(cat /workspace/monitor-image-digest.txt)"
        revision="$$(cat /workspace/monitor-candidate-revision.txt)"
        [[ "$${revision}" =~ ^${_SERVICE_NAME}-${SHORT_SHA}-[0-9a-f]{8}$ ]] || {
          echo 'candidate revision receipt is invalid' >&2
          exit 2
        }
        predeploy_runtime_service_account="$$(
          cat /workspace/monitor-predeploy-runtime-service-account.txt
        )"
        [[ "$${predeploy_runtime_service_account}" == "${_RUNTIME_SERVICE_ACCOUNT}" ]] || {
          echo 'predeploy runtime identity receipt is invalid' >&2
          exit 2
        }
        service_json=/workspace/monitor-candidate-service.json
        revision_json=/workspace/monitor-candidate-revision.json
        gcloud run services describe "${_SERVICE_NAME}" \
          --project "${PROJECT_ID}" \
          --region "${_REGION}" --format=json > "$${service_json}"
        gcloud run services get-iam-policy "${_SERVICE_NAME}" \
          --project "${PROJECT_ID}" --region "${_REGION}" --format=json \
          > /workspace/monitor-candidate-iam.json
        python3 scripts/verify_service_access_contract.py \
          --before-service /workspace/monitor-predeploy-service.json \
          --after-service "$${service_json}" \
          --before-iam /workspace/monitor-predeploy-iam.json \
          --after-iam /workspace/monitor-candidate-iam.json
        gcloud run revisions describe "$${revision}" \
          --project "${PROJECT_ID}" \
          --region "${_REGION}" --format=json > "$${revision_json}"
        python3 scripts/verify_candidate_service.py \
          --service-json "$${service_json}" \
          --revision-json "$${revision_json}" \
          --expected-project "${PROJECT_ID}" \
          --expected-region "${_REGION}" \
          --expected-service "${_SERVICE_NAME}" \
          --expected-image "$${immutable_image}" \
          --expected-revision "$${revision}" \
          --expected-service-account "${_RUNTIME_SERVICE_ACCOUNT}" \
          --expected-git-sha "${COMMIT_SHA}" \
          --candidate-tag candidate

substitutions:
  _SERVICE_NAME: oura-navi-monitor
  _REGION: us-central1
  _RUNTIME_SERVICE_ACCOUNT: lcs-agent@lcs-developer-483404.iam.gserviceaccount.com

timeout: 1800s

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/${_SERVICE_NAME}:$COMMIT_SHA
